syntax = "proto3";
package smartnodes.tickets.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/mspvantage/smartnodes/x/tickets/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "smartnodes/x/tickets/Params";
  option (gogoproto.equal) = true;

  uint64 issuance_deadline_blocks = 1;
  uint64 max_batch = 2;
  uint64 fee_bps = 3;
  uint64 retention_blocks = 4;
  // bridge_answer_blocks is how long a bridge has to answer a request
  // before it passes to another.
  uint64 bridge_answer_blocks = 5;
  // bridge_tries is how many bridges are asked before a request lapses.
  uint64 bridge_tries = 6;
  // bridge_handout_limit is how many people one bridge line is given to
  // before the bridge is no longer handed out, until it moves.
  uint64 bridge_handout_limit = 7;
}
