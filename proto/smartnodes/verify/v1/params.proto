syntax = "proto3";
package smartnodes.verify.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/mspvantage/smartnodes/x/verify/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "smartnodes/x/verify/Params";
  option (gogoproto.equal) = true;

  uint64 round_blocks = 1;
  uint64 probers_per_node = 2;
  uint64 sample_bps = 3;
  uint64 min_prober_bond = 4;
  uint64 unbonding_seconds = 5;
  uint64 fails_before_jail = 6;
  uint64 tamper_slash_bps = 7;
  bool report_only = 8;
}
