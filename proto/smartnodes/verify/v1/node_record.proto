syntax = "proto3";
package smartnodes.verify.v1;

option go_package = "github.com/mspvantage/smartnodes/x/verify/types";

// NodeRecord is what verification knows about one VPN node.
message NodeRecord {
  uint64 node_id = 1;
  // verified is true if the node passed the last round it was tallied in.
  bool verified = 2;
  // last_round is the last round in which reports for the node were tallied.
  uint64 last_round = 3;
  // last_pass_round is the last round the node passed, or 0.
  uint64 last_pass_round = 4;
  // consecutive_fails counts failed rounds since the last pass.
  uint64 consecutive_fails = 5;
  // passes and fails count every decided round.
  uint64 passes = 6;
  uint64 fails = 7;
  // tamper_rounds counts rounds in which every assigned prober reported
  // tampering.
  uint64 tamper_rounds = 8;
  // jailed nodes are not probed and are left out of client listings until
  // the operator unjails them.
  bool jailed = 9;
  // jailed_at is the block time, in Unix seconds, of the last jailing.
  int64 jailed_at = 10;
  // jail_count counts how many times the node has been jailed.
  uint64 jail_count = 11;
  // slashed is the total bond burned for proven tampering, in the base unit
  // of the staking token.
  uint64 slashed = 12;
  // pending_round is the last round the node earned a reward share in that
  // has not been turned into an amount yet, or 0.
  uint64 pending_round = 13;
  // pending_weight is the node's weight in pending_round's budget.
  uint64 pending_weight = 14;
  // reward_balance is the reward the operator can claim, in the base unit of
  // the staking token. It never expires.
  uint64 reward_balance = 15;
  // reward_paid is the total reward claimed so far.
  uint64 reward_paid = 16;
  // Customer flags raise how often the node is probed, from flagged_from to
  // flagged_until, both rounds. flags counts every flag ever.
  uint64 flagged_from = 17;
  uint64 flagged_until = 18;
  uint64 flags = 19;
  // unjailed_round is the round the node was last unjailed in, or 0; it is
  // probed more often for a while after.
  uint64 unjailed_round = 20;
}
