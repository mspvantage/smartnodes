syntax = "proto3";

package smartnodes.verify.v1;

import "amino/amino.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "smartnodes/verify/v1/node_record.proto";
import "smartnodes/verify/v1/params.proto";
import "smartnodes/verify/v1/prober.proto";

option go_package = "github.com/mspvantage/smartnodes/x/verify/types";

// Query defines the gRPC querier service.
service Query {
  // Parameters queries the parameters of the module.
  rpc Params(QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/mspvantage/smartnodes/verify/v1/params";
  }

  // ListProber Queries a list of Prober items.
  rpc GetProber(QueryGetProberRequest) returns (QueryGetProberResponse) {
    option (google.api.http).get = "/mspvantage/smartnodes/verify/v1/prober/{id}";
  }

  // ListProber defines the ListProber RPC.
  rpc ListProber(QueryAllProberRequest) returns (QueryAllProberResponse) {
    option (google.api.http).get = "/mspvantage/smartnodes/verify/v1/prober";
  }

  // Round returns the current verification round.
  rpc Round(QueryRoundRequest) returns (QueryRoundResponse) {
    option (google.api.http).get = "/mspvantage/smartnodes/verify/v1/round";
  }

  // NodeRecord returns a node's verification record.
  rpc NodeRecord(QueryNodeRecordRequest) returns (QueryNodeRecordResponse) {
    option (google.api.http).get = "/mspvantage/smartnodes/verify/v1/node_record/{node_id}";
  }

  // Assignment returns the probers assigned to a node in the current round.
  rpc Assignment(QueryAssignmentRequest) returns (QueryAssignmentResponse) {
    option (google.api.http).get = "/mspvantage/smartnodes/verify/v1/assignment/{node_id}";
  }

  // RewardPool returns the state of the node rewards pool.
  rpc RewardPool(QueryRewardPoolRequest) returns (QueryRewardPoolResponse) {
    option (google.api.http).get = "/mspvantage/smartnodes/verify/v1/reward_pool";
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  // params holds all the parameters of this module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// QueryGetProberRequest defines the QueryGetProberRequest message.
message QueryGetProberRequest {
  uint64 id = 1;
}

// QueryGetProberResponse defines the QueryGetProberResponse message.
message QueryGetProberResponse {
  Prober prober = 1 [(gogoproto.nullable) = false];
}

// QueryAllProberRequest defines the QueryAllProberRequest message.
message QueryAllProberRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

// QueryAllProberResponse defines the QueryAllProberResponse message.
message QueryAllProberResponse {
  repeated Prober prober = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

// QueryRoundRequest defines the QueryRoundRequest message.
message QueryRoundRequest {}

// QueryRoundResponse defines the QueryRoundResponse message.
message QueryRoundResponse {
  // round is the current round number, or 0 before the first round.
  uint64 round = 1;
  // start_height is the block at which the round started.
  int64 start_height = 2;
  // next_round_height is the block at which the next round starts.
  int64 next_round_height = 3;
  // seed is the round's random seed, in hex.
  string seed = 4;
  // active_probers is the number of probers in the active set.
  uint64 active_probers = 5;
}

// QueryNodeRecordRequest defines the QueryNodeRecordRequest message.
message QueryNodeRecordRequest {
  uint64 node_id = 1;
}

// QueryNodeRecordResponse defines the QueryNodeRecordResponse message.
message QueryNodeRecordResponse {
  NodeRecord node_record = 1 [(gogoproto.nullable) = false];
}

// QueryAssignmentRequest defines the QueryAssignmentRequest message.
message QueryAssignmentRequest {
  uint64 node_id = 1;
}

// QueryAssignmentResponse defines the QueryAssignmentResponse message.
message QueryAssignmentResponse {
  uint64 round = 1;
  // selected is true if the node is probed this round.
  bool selected = 2;
  // prober_ids are the probers assigned to the node, if it is selected.
  repeated uint64 prober_ids = 3;
}

// QueryRewardPoolRequest defines the QueryRewardPoolRequest message.
message QueryRewardPoolRequest {}

// QueryRewardPoolResponse defines the QueryRewardPoolResponse message.
// Amounts are in the base unit of the staking token.
message QueryRewardPoolResponse {
  // address is the pool's account address.
  string address = 1;
  // balance is what the pool account holds.
  uint64 balance = 2;
  // owed is the part of the balance already earned by nodes and waiting to
  // be claimed.
  uint64 owed = 3;
  // round_budget is the current round's budget for verified nodes.
  uint64 round_budget = 4;
}
