syntax = "proto3";

package smartnodes.verify.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "smartnodes/verify/v1/params.proto";
import "smartnodes/verify/v1/prober.proto";

option go_package = "github.com/mspvantage/smartnodes/x/verify/types";

// GenesisState defines the verify module's genesis state.
message GenesisState {
  // params defines all the parameters of the module.
  Params params = 1 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
  repeated Prober prober_list = 2 [(gogoproto.nullable) = false];
  uint64 prober_count = 3;
}
