syntax = "proto3";
package smartnodes.rewards.v1;

import "amino/amino.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/mspvantage/smartnodes/x/rewards/types";

// Params defines the parameters for the module.
message Params {
  option (amino.name) = "smartnodes/x/rewards/Params";
  option (gogoproto.equal) = true;

  uint64 equal_share_bps = 1;
  // max_commission_bps is the highest maximum commission a new validator
  // may set, in basis points. A validator can never raise its commission
  // above the maximum it set when it was created.
  uint64 max_commission_bps = 2;
}
