syntax = "proto3";

package smartnodes.registry.v1;

import "amino/amino.proto";
import "cosmos/base/v1beta1/coin.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "smartnodes/registry/v1/params.proto";

option go_package = "github.com/mspvantage/smartnodes/x/registry/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;

  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams(MsgUpdateParams) returns (MsgUpdateParamsResponse);

  // SponsorNode registers a node for an operator with a bond lent by the
  // sponsor pool. Only the sponsor account may send it.
  rpc SponsorNode(MsgSponsorNode) returns (MsgSponsorNodeResponse);

  // FundSponsorPool adds coins to the sponsor pool. Anyone may.
  rpc FundSponsorPool(MsgFundSponsorPool) returns (MsgFundSponsorPoolResponse);

  // RegisterNode defines the RegisterNode RPC.
  rpc RegisterNode(MsgRegisterNode) returns (MsgRegisterNodeResponse);

  // UpdateNode defines the UpdateNode RPC.
  rpc UpdateNode(MsgUpdateNode) returns (MsgUpdateNodeResponse);

  // AddBond defines the AddBond RPC.
  rpc AddBond(MsgAddBond) returns (MsgAddBondResponse);

  // DeregisterNode defines the DeregisterNode RPC.
  rpc DeregisterNode(MsgDeregisterNode) returns (MsgDeregisterNodeResponse);

  // WithdrawBond defines the WithdrawBond RPC.
  rpc WithdrawBond(MsgWithdrawBond) returns (MsgWithdrawBondResponse);

  // SetServiceKey sets or clears the account that may redeem a node's
  // tickets on the operator's behalf. Only the operator may send it.
  rpc SetServiceKey(MsgSetServiceKey) returns (MsgSetServiceKeyResponse);

  // SetReality publishes or, with port 0, withdraws an entry node's
  // disguised way in. Only the operator may send it.
  rpc SetReality(MsgSetReality) returns (MsgSetRealityResponse);

  // RegisterBridge registers an unlisted entry node, a bridge, by the
  // fingerprint of its bridge line alone.
  rpc RegisterBridge(MsgRegisterBridge) returns (MsgRegisterBridgeResponse);

  // UpdateBridge replaces a bridge's fingerprint, as when it moves to a new
  // address after being blocked.
  rpc UpdateBridge(MsgUpdateBridge) returns (MsgUpdateBridgeResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) = "authority";
  option (amino.name) = "smartnodes/x/registry/MsgUpdateParams";

  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.

  // NOTE: All parameters must be supplied.
  Params params = 2 [
    (gogoproto.nullable) = false,
    (amino.dont_omitempty) = true
  ];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

// MsgRegisterNode defines the MsgRegisterNode message.
message MsgRegisterNode {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string endpoint = 2;
  string pubkey = 3;
  uint64 tier = 4;
  cosmos.base.v1beta1.Coin bond = 5 [(gogoproto.nullable) = false];
}

// MsgRegisterNodeResponse defines the MsgRegisterNodeResponse message.
message MsgRegisterNodeResponse {
  uint64 id = 1;
}

// MsgUpdateNode defines the MsgUpdateNode message.
message MsgUpdateNode {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id = 2;
  string endpoint = 3;
  string pubkey = 4;
}

// MsgUpdateNodeResponse defines the MsgUpdateNodeResponse message.
message MsgUpdateNodeResponse {}

// MsgAddBond defines the MsgAddBond message.
message MsgAddBond {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id = 2;
  cosmos.base.v1beta1.Coin amount = 3 [(gogoproto.nullable) = false];
}

// MsgAddBondResponse defines the MsgAddBondResponse message.
message MsgAddBondResponse {}

// MsgDeregisterNode defines the MsgDeregisterNode message.
message MsgDeregisterNode {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id = 2;
}

// MsgDeregisterNodeResponse defines the MsgDeregisterNodeResponse message.
message MsgDeregisterNodeResponse {}

// MsgWithdrawBond defines the MsgWithdrawBond message.
message MsgWithdrawBond {
  option (cosmos.msg.v1.signer) = "operator";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id = 2;
}

// MsgWithdrawBondResponse defines the MsgWithdrawBondResponse message.
message MsgWithdrawBondResponse {}

// MsgSponsorNode defines the MsgSponsorNode message.
message MsgSponsorNode {
  option (cosmos.msg.v1.signer) = "sponsor";
  string sponsor = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // operator is the account that will run the node.
  string operator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string endpoint = 3;
  string pubkey = 4;
  uint64 tier = 5;
}

// MsgSponsorNodeResponse defines the MsgSponsorNodeResponse message.
message MsgSponsorNodeResponse {
  uint64 id = 1;
}

// MsgFundSponsorPool defines the MsgFundSponsorPool message.
message MsgFundSponsorPool {
  option (cosmos.msg.v1.signer) = "sender";
  string sender = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // amount is in the base unit of the staking token.
  uint64 amount = 2;
}

// MsgFundSponsorPoolResponse defines the MsgFundSponsorPoolResponse message.
message MsgFundSponsorPoolResponse {}

// MsgSetServiceKey sets a node's service key. An empty service_key clears it.
message MsgSetServiceKey {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "smartnodes/x/registry/MsgSetServiceKey";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id = 2;
  string service_key = 3;
}

// MsgSetServiceKeyResponse defines the MsgSetServiceKeyResponse message.
message MsgSetServiceKeyResponse {}

// MsgSetReality sets an entry node's REALITY disguise. Port 0 removes it.
message MsgSetReality {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "smartnodes/x/registry/MsgSetReality";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id = 2;
  uint32 port = 3;
  string public_key = 4;
  string short_id = 5;
  string server_name = 6;
  string uuid = 7;
}

// MsgSetRealityResponse defines the MsgSetRealityResponse message.
message MsgSetRealityResponse {}

// MsgRegisterBridge registers a bridge with the minimum entry bond or more.
message MsgRegisterBridge {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "smartnodes/x/registry/MsgRegisterBridge";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string commitment = 2;
  cosmos.base.v1beta1.Coin bond = 3 [(gogoproto.nullable) = false];
}

// MsgRegisterBridgeResponse defines the MsgRegisterBridgeResponse message.
message MsgRegisterBridgeResponse {
  uint64 id = 1;
}

// MsgUpdateBridge replaces a bridge's fingerprint.
message MsgUpdateBridge {
  option (cosmos.msg.v1.signer) = "operator";
  option (amino.name) = "smartnodes/x/registry/MsgUpdateBridge";
  string operator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id = 2;
  string commitment = 3;
}

// MsgUpdateBridgeResponse defines the MsgUpdateBridgeResponse message.
message MsgUpdateBridgeResponse {}
