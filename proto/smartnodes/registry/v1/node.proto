syntax = "proto3";
package smartnodes.registry.v1;

import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/mspvantage/smartnodes/x/registry/types";

// Node defines the Node message.
message Node {
  uint64 id = 1;
  string operator = 2;
  string endpoint = 3;
  string pubkey = 4;
  uint64 tier = 5;
  cosmos.base.v1beta1.Coin bond = 6 [(gogoproto.nullable) = false];
  uint64 status = 7;
  int64 unbonding_end = 8;
  // sponsored is the part of the bond lent by the sponsor pool, in the base
  // unit of the staking token. It returns to the pool when the node leaves.
  // A slash burns the operator's own part of the bond first.
  uint64 sponsored = 9;
  // service_key, if set, is a second account that may redeem this node's
  // tickets and nothing else. Payment still goes to the operator. It lets the
  // operator's own key, which controls the bond, stay off the node's server.
  string service_key = 10 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}
