syntax = "proto3";
package smartnodes.registry.v1;

import "cosmos/base/v1beta1/coin.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";

option go_package = "github.com/mspvantage/smartnodes/x/registry/types";

// Node defines the Node message.
message Node {
  uint64 id = 1;
  string operator = 2;
  string endpoint = 3;
  string pubkey = 4;
  uint64 tier = 5;
  cosmos.base.v1beta1.Coin bond = 6 [(gogoproto.nullable) = false];
  uint64 status = 7;
  int64 unbonding_end = 8;
  // sponsored is the part of the bond lent by the sponsor pool, in the base
  // unit of the staking token. It returns to the pool when the node leaves.
  // A slash burns the operator's own part of the bond first.
  uint64 sponsored = 9;
  // service_key, if set, is a second account that may redeem this node's
  // tickets and nothing else. Payment still goes to the operator. It lets the
  // operator's own key, which controls the bond, stay off the node's server.
  string service_key = 10 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  // reality, if set, is the node's disguised way in for devices in countries
  // that block VPNs. Only entry nodes offer it. Nothing in it is secret.
  Reality reality = 11;
  // commitment, if set, makes the node a bridge: an unlisted entry node.
  // Its address, keys and disguise are never on the chain; the operator
  // hands them out as a bridge line, and this is that line's SHA-256, in
  // lowercase hex, so a line can be checked against a bonded node. A
  // bridge has no endpoint, pubkey or reality here, and is not probed.
  string commitment = 12;
}

// Reality describes an entry node's Xray REALITY disguise.
message Reality {
  // port is the TCP port it listens on, usually 443.
  uint32 port = 1;
  // public_key is the node's REALITY public key: 32 bytes, base64url
  // without padding.
  string public_key = 2;
  // short_id is up to 16 lowercase hex characters, in pairs.
  string short_id = 3;
  // server_name is the cover site's name, which devices present.
  string server_name = 4;
  // uuid is the published VLESS user id; it grants nothing by itself.
  string uuid = 5;
}
